[package]
name = "cult-backend"
version = "0.1.0"
edition = "2021"

[dependencies]
actix-web = "4.4.0"  
actix-service = "2.0.3"
futures = "0.3.31"
actix-web-actors = "4.2.0" 
actix = "0.13.1" 
serde = { version = "1.0.193", features = ["derive"] } 
serde_json = "1.0"
sqlx = { version = "0.8.3", features = ["runtime-tokio-native-tls", "postgres", "chrono"] } 
tokio = { version = "1.32.0", features = ["full","rt-multi-thread"] } 
tokio-postgres = "0.7"
env_logger = "0.11.7" 
log = "0.4.20" 
dotenv = "0.15"  # For loading environment variables
actix-multipart = "0.7.2"
thiserror = "2.0.9"
image = "0.25.5"
chrono = { version = "0.4.39", features = ["serde"] }
alloy = { version = "0.12.5", features = ["full"] }
anyhow = "1.0"
reqwest = { version = "0.12.15", features = ["json"] }
alloy-merkle-tree = "0.7.2"
hmac = "0.12"
sha2 = "0.10"
uuid = { version = "1.3", features = ["v4", "serde"] }
hex = "0.4"
bytes = "1.5"
rand = "0.9.0"
ordered-float = "5.0.0"
graphql_client = "0.13"
